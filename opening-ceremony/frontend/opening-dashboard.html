<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Screen — Live Wishes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./opening-style.css" />
  <meta name="theme-color" content="#162c1b" />
  <!-- CSP: allow live connections to the backend (adjust domain if you change it) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; connect-src 'self' https://blockchain-lab-website-production.up.railway.app wss://blockchain-lab-website-production.up.railway.app; script-src 'self' 'unsafe-inline' https://cdn.socket.io https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com;" />
</head>
<body class="oc-body oc-dashboard">
  <div class="oc-bg"></div>
  <main class="oc-container">
    <header class="oc-header oc-header-dashboard">
      <div class="oc-brand">
        <img src="../../assets/images/BFLab_yellow icon_logo.png" alt="Blockchain Lab" class="oc-logo" />
        <div class="oc-title">
          <h1>Guest wishes</h1>
          <p>Updates in real time</p>
        </div>
      </div>
      
    </header>
    
    <section class="oc-stage">
      <div class="oc-hero" aria-live="polite">
        <div id="heroNumber" class="oc-hero-number">0</div>
        <div class="oc-hero-label">total wishes</div>
      </div>
      <div id="bubbleStage" class="oc-bubble-stage" aria-hidden="true"></div>
    </section>

    <!-- Blockchain section: moved outside stage to avoid overlap with center counter -->
    <div class="blockchain-section" id="blockchainSection">
      <div class="commit-controls">
        <button id="commitButton" class="commit-button">🚀 SEND FIRST TRANSACTION</button>
        <div class="commit-stats">Ready to send: <span id="readyWishesCount">0</span> notes</div>
      </div>

      <div class="transaction-status" id="transactionStatus" style="display: none;">
        <div class="blockchain-animation" id="blockchainAnimation">
          <div class="mining-animation">
            <div class="block"></div>
            <div class="block"></div>
            <div class="block"></div>
            <div class="loading-text">Mining on KazSmartChain...</div>
          </div>
        </div>

        <div class="success-result" id="successResult" style="display: none;">
          <div class="success-header">
            <span class="success-icon">✅</span>
            <h3>SUCCESSFULLY SENT FIRST TRANSACTION!</h3>
          </div>
          <div class="transaction-details">
            <div class="detail">
              <label>Transaction:</label>
              <code class="transaction-hash" id="transactionHash"></code>
            </div>
            <div class="detail">
              <label>Block:</label>
              <span id="blockNumber"></span>
            </div>
            <div class="detail">
              <label>Total wishes:</label>
              <span id="committedWishes"></span>
            </div>
            <div class="detail">
              <label>Merkle Root:</label>
              <code class="root-hash" id="rootHash"></code>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Config: Set BACKEND_URL after deploy -->
  <script>
    window.OC_CONFIG = {
      // TODO: After deploy, set your backend URL below
      // Example: 'https://opening-ceremony-backend.up.railway.app'
      BACKEND_URL: 'https://blockchain-lab-website-production.up.railway.app/'
    };
  </script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" integrity="sha384-bcdh8G6oAzhR9j4vJ3Xg1wAzblqEw3Vd7x6VqpWoYAQdD+uYVwhwAFGMpMVMlN4C" crossorigin="anonymous"></script>
  <script src="./opening-script.js" type="module"></script>
</body>
</html>
