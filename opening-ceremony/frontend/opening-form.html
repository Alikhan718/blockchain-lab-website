<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guest Note — Blockchain Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- NOTE: Replace or self-host the brand fonts if you have licenses -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./opening-style.css" />
  <meta name="theme-color" content="#162c1b" />
  <!-- CSP: allow live connections to the backend (adjust domain if you change it) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; connect-src 'self' https://blockchain-lab-website-production.up.railway.app wss://blockchain-lab-website-production.up.railway.app; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com;" />
</head>
<body class="oc-body">
  <div class="oc-bg"></div>
  <main class="oc-container">
    <header class="oc-header">
      <div class="oc-brand">
        <img src="../../assets/images/BFLab_yellow icon_logo.png" alt="Blockchain Lab" class="oc-logo" />
        <div class="oc-title">
          <h1>Blockchain Lab</h1>
          <p>Official Opening — leave your note</p>
        </div>
      </div>
    </header>

    <section class="oc-card oc-animate-in">
      <h2>Your note</h2>
      <form id="wishForm" class="oc-form" autocomplete="on" novalidate>
        <div class="oc-field">
          <label for="fullName">Full name</label>
          <input id="fullName" name="fullName" type="text" maxlength="120" required placeholder="John Smith" />
        </div>
        <div class="oc-field">
          <label for="message">Note / idea</label>
          <textarea id="message" name="message" rows="5" maxlength="1000" required placeholder="Write your note..."></textarea>
        </div>

        <button type="submit" class="oc-button">
          <span class="oc-button-glow"></span>
          Submit
        </button>

        <p id="status" class="oc-status" aria-live="polite"></p>
      </form>

      <!-- Thank-you state (hidden by default) -->
      <div id="thankYou" class="oc-thanks hidden" role="status" aria-live="polite">
        <div class="oc-thanks-emoji">🎉</div>
        <h3>Thank you for your contribution!</h3>
        <p>Your note will be delivered to the Blockchain.</p>
        <a class="oc-dashboard-link" href="./opening-dashboard.html">Open event screen</a>
      </div>
    </section>

    <footer class="oc-footer">
      <p>Thank you for participating! Your support matters.</p>
    </footer>
  </main>

  <!-- Config: Set BACKEND_URL after deploy -->
  <script>
    window.OC_CONFIG = {
      // TODO: After deploy, set your backend URL below
      // Example: 'https://opening-ceremony-backend.up.railway.app'
      BACKEND_URL: 'https://blockchain-lab-website-production.up.railway.app/'
    };
  </script>
  <script src="./opening-script.js" type="module"></script>
</body>
</html>
